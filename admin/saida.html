<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saída - Trattoria Aldini</title>
  <link rel="stylesheet" href="saida.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
  <div class="admin-layout">
    <div class="sidebar">
      <div class="sidebar-header">
        <img src="steve-pizza.png" alt="Steve" class="steve-icon">
        <h2>ADM</h2>
      </div>
      <nav class="menu">
        <a href="paineladm.html" class="menu-item">Pro. Vendidos</a>
        <a href="estoque.html" class="menu-item">Estoque</a>
        <a href="chegada.html" class="menu-item">Chegada</a>
        <a href="saida.html" class="menu-item active">Saída</a>
        <a href="ponto.html" class="menu-item">Ponto</a>
        <a href="vencimento.html" class="menu-item">Vencimento</a>
        <a href="parcerias.html" class="menu-item">Parcerias</a>
        <a href="avaliacoes.html" class="menu-item">Avaliações</a>
        <a href="funcionarios.html" class="menu-item">Funcionários</a>
      </nav>
      <button class="btn-logout" id="logoutBtn">Sair</button>
    </div>

    <div class="main-content">
      <header class="topbar">
        <h1>Registro de Saída</h1>
        <button id="btnPdf" class="pdf-btn">📄 Baixar PDF</button>
        <button id="openModalBtn" class="add-btn">+ Nova Saída</button>
      </header>

      <div class="exit-list">
        <h2>Histórico de Saídas</h2>
        <table>
          <thead>
            <tr>
              <th>Data</th>
              <th>Produto</th>
              <th>Lote</th>
              <th>Quantidade</th>
              <th>Motivo</th>
              <th>Responsável</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="saidaBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="saidaModal" class="modal">
    <div class="modal-content">
      <h3>Nova Saída</h3>
      <form id="saidaForm">
        <input type="hidden" id="editIndex">

        <label>Nome do Produto:</label>
        <select id="produto" required>
          <option value="">Selecione um produto</option>
        </select>

        <label>Quantidade:</label>
        <div class="qtd-group">
          <input type="number" id="quantidadeNum" step="0.01" min="0" required>
          <select id="unidade">
            <option value="kg">kg</option>
            <option value="g">g</option>
            <option value="L">L</option>
            <option value="ml">ml</option>
            <option value="un">un</option>
            <option value="cx">cx</option>
            <option value="pct">pct</option>
          </select>
        </div>

        <label>Lote:</label>
        <div class="lote-group">
          <span class="lote-prefix">LOT-</span>
          <input type="text" id="lote" placeholder="0000">
        </div>

        <label>Motivo:</label>
        <input type="text" id="motivo" required>

        <label>Responsável:</label>
        <input type="text" id="responsavel" required>

        <label>Data:</label>
        <input type="date" id="dataSaida">

        <div class="modal-buttons">
          <button type="button" id="cancelModalBtn">Cancelar</button>
          <button type="submit">Salvar</button>
        </div>
      </form>
    </div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script src="../db.js"></script>
<script src="saida.js"></script>  <!-- ou saida.js / ponto.js -->
</body>
</html>
