<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produtos Mais Vendidos - Trattoria Aldini</title>
  <link rel="stylesheet" href="avaliacoes.css">
</head>
<body>
  <div class="admin-layout">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <img src="steve-pizza.png" alt="Steve" class="steve-icon">
        <h2>ADM</h2>
      </div>
      <nav class="menu">
        <a href="paineladm.html" class="menu-item active">Pro. Vendidos</a>
        <a href="estoque.html" class="menu-item">Estoque</a>
        <a href="chegada.html" class="menu-item">Chegada</a>
        <a href="saida.html" class="menu-item">Saída</a>
        <a href="ponto.html" class="menu-item">Ponto</a>
        <a href="vencimento.html" class="menu-item">Vencimento</a>
        <a href="parcerias.html" class="menu-item">Parcerias</a>
        <a href="avaliacoes.html" class="menu-item">Avaliações</a>
        <a href="funcionarios.html" class="menu-item">Funcionários</a>
      </nav>
      <button class="btn-logout" id="logoutBtn">Sair</button>
    </div>

    <!-- Conteúdo Principal -->
    <div class="main-content">
      <header class="topbar">
        <h1>Produtos Mais Vendidos</h1>
      </header>

      <div class="avaliacoes-list">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px;">
          <h2>Ranking de Vendas</h2>
          
          <div style="display: flex; gap: 10px; align-items: center;">
            <label for="filtroCategoria" style="font-weight: 600; color: #2a1608;">Categoria:</label>
            <select id="filtroCategoria" style="padding: 8px 12px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; font-family: inherit;">
              <option value="todos">Todos</option>
              <option value="Pizza">Pizzas Salgadas</option>
              <option value="Doce">Sobremesas (Doces)</option>
              <option value="Bebida">Bebidas</option>
              <option value="Combo">Combos</option>
            </select>
            <button id="btnAtualizar" style="padding: 8px 14px; background: #1f7a3a; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-family: inherit;">
              🔄 Atualizar
            </button>
          </div>
        </div>

        <table>
          <thead>
            <tr>
              <th># Pos.</th>
              <th>Produto</th>
              <th>Categoria</th>
              <th>Preço Unitário</th>
              <th>Qtd. Vendida</th>
              <th>Faturamento Total</th>
            </tr>
          </thead>
          <tbody id="produtosVendidosBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
  <script src="../db.js"></script>
  <script src="paineladm.js"></script>
</body>
</html>
