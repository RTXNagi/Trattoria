<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar - Trattoria Aldini</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="italia">

    <div class="login-container">
      <div class="steve-small">
        <img src="steve-pizza.png" alt="Steve Pizza">
      </div>

      <div class="card">
        <h1>Trattoria Aldini</h1>
        <p class="subtitle">Benvenuti</p>

        <form id="loginForm" class="form">
          <input type="text" id="username" placeholder="Usuário ou Email" required>
          
          <div class="password-group">
            <input type="password" id="password" placeholder="Senha" required>
            <button type="button" id="togglePassword" class="toggle-password">👁️</button>
          </div>
          
          <button type="submit" class="btn">Entrar</button>
        </form>

        <p id="errorMessage" class="error"></p>

        <div class="toggle-link">
          <span>Não tem conta?</span>
          <button id="toggleBtn" class="link-btn">Cadastrar</button>
        </div>
      </div>
    </div>

  </div>

<script src="login.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script src="../db.js"></script>   <!-- ajuste o caminho se necessário -->
</body>
</html>
